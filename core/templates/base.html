<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: localStorage.getItem('dark') === 'true' }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriScan | AI Health Assistant</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: { 500: '#10b981', 600: '#059669' },
                        slate: { 950: '#020617' }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root { --glass-bg: rgba(255, 255, 255, 0.7); }
        .dark { --glass-bg: rgba(15, 23, 42, 0.7); }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #f8fafc, #f1f5f9);
        }
        .dark body {
            background: radial-gradient(circle at top right, #0f172a, #020617);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        .premium-gradient {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .floating { animation: floating 3s ease-in-out infinite; }
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-500">

    <header class="sticky top-0 z-50 w-full border-b border-slate-200/50 dark:border-slate-800/50 nav-blur bg-white/70 dark:bg-slate-950/70">
        <nav class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <a href="{% url 'home' %}" class="flex items-center space-x-2 group">
                <div class="w-10 h-10 bg-[#0fa36b] rounded-xl flex items-center justify-center shadow-lg group-hover:rotate-6 transition-transform">
                    <span class="text-white text-xl">🍃</span>
                </div>
                <h1 class="text-2xl font-black text-slate-800 dark:text-white tracking-tighter">
                    Nutri<span class="text-[#0fa36b]">Scan</span>
                </h1>
            </a>

            <div class="hidden md:flex items-center space-x-8">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-emerald-500 transition-colors">Dashboard</a>
                    <a href="{% url 'food_scan' %}" class="flex items-center space-x-1 px-4 py-2 rounded-xl bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 hover:bg-emerald-500 hover:text-white transition-all">
                        <span class="text-sm">📸</span>
                        <span class="text-xs font-black uppercase tracking-widest">AI Scan</span>
                    </a>
                    <a href="{% url 'profile' %}" class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-emerald-500 transition-colors">Profile</a>
                    <a href="{% url 'diet' %}" class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-emerald-500 transition-colors">Diet Plan</a>
                    <a href="{% url 'performance' %}" class="text-xs font-black uppercase tracking-widest text-slate-500 hover:text-emerald-500 transition-colors">Insights</a>
                {% endif %}
            </div>

            <div class="flex items-center space-x-4">
                <button @click="darkMode = !darkMode; localStorage.setItem('dark', darkMode)" 
                        class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-yellow-400 hover:scale-105 transition-all">
                    <span x-show="!darkMode">🌙</span>
                    <span x-show="darkMode">☀️</span>
                </button>

                {% if user.is_authenticated %}
                    <form method="POST" action="{% url 'logout' %}" class="hidden md:block">
                        {% csrf_token %}
                        <button type="submit" class="text-sm font-extrabold text-rose-500 px-4 py-2 hover:text-rose-600 transition-colors">Sign Out</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-sm font-bold text-slate-600 dark:text-slate-400 hover:text-[#0fa36b]">Login</a>
                    <a href="{% url 'register' %}" class="bg-slate-900 dark:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-xl hover:-translate-y-0.5 transition-all active:scale-95">
                        Get Started
                    </a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="flex-grow relative">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-10 mt-10">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h2 class="text-lg font-black text-[#0fa36b] mb-2 italic">NutriScan AI</h2>
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-[0.3em]">
                &copy; 2026 NutriScan Technologies Inc.
            </p>
        </div>
    </footer>
    <canvas id="three-canvas"></canvas>
    <script>
        const canvas = document.querySelector('#three-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.005,
            color: '#10b981'
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);
        onWindowResize();
        animate();
    </script>
</body>
</html>
