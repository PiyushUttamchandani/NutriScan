{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] px-4 animate-fade-in bg-slate-50 dark:bg-slate-950 transition-colors duration-500">
    <div class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl p-8 md:p-12 rounded-[3.5rem] shadow-xl border border-slate-50 dark:border-slate-800 max-w-lg w-full transition-all">
        
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-rose-50 dark:bg-rose-900/30 text-rose-500 rounded-3xl flex items-center justify-center mx-auto mb-4 shadow-inner group transition-transform hover:rotate-12">
                <span class="text-3xl">🔐</span>
            </div>
            <h2 class="text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight">Security</h2>
            <p class="text-slate-500 dark:text-slate-400 font-medium mt-1 text-sm">Update your account password</p>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4">
                {% for field in form %}
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-2 ml-1">
                        {{ field.label }}
                    </label>
                    <div class="password-input-wrapper">
                        {{ field }}
                    </div>
                    {% if field.errors %}
                        <p class="text-rose-500 text-[11px] font-bold mt-2 ml-1 animate-pulse">{{ field.errors|first }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-6">
                <button type="submit" class="w-full py-5 bg-slate-900 dark:bg-emerald-600 text-white rounded-2xl font-bold shadow-2xl hover:bg-slate-800 dark:hover:bg-emerald-700 hover:-translate-y-1 transition-all duration-300 active:scale-95">
                    Update Password
                </button>
            </div>
        </form>

        <div class="text-center mt-8">
            <a href="{% url 'profile' %}" class="text-slate-400 dark:text-slate-500 font-bold hover:text-slate-600 dark:hover:text-slate-300 transition-all text-sm flex items-center justify-center gap-2">
                <span>←</span> Back to Profile
            </a>
        </div>
    </div>
</div>

<style>
    /* Global Input Styling for Dark Mode */
    .password-input-wrapper input {
        width: 100%;
        padding: 1rem 1.25rem;
        background-color: #f8fafc;
        border: 2px solid #f1f5f9;
        border-radius: 1.25rem;
        outline: none;
        transition: all 0.3s ease;
        font-weight: 600;
    }

    /* Dark Mode specific input styles */
    .dark .password-input-wrapper input {
        background-color: #0f172a; /* slate-900 */
        border-color: #1e293b; /* slate-800 */
        color: #f1f5f9;
    }

    .password-input-wrapper input:focus {
        border-color: #10b981;
        background-color: white;
        box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.1);
    }

    .dark .password-input-wrapper input:focus {
        background-color: #1e293b;
        border-color: #10b981;
    }
</style>
{% endblock %}
